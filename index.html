const pad=n=>n<10?"0"+n:""+n;
const fmt=d=>{const x=new Date(d);return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};
const fmtShort=d=>{const x=new Date(d);return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});};

const weekStart=d=>{const x=new Date(d);const day=x.getDay()||7;if(day!==1)x.setDate(x.getDate()-(day-1));x.setHours(0,0,0,0);return x;};

/* ---------- GITHUB SYNC ---------- */
async function ghGet(cfg){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`;
  const res=await fetch(url,{headers:{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json"}});
  if(res.status===404)return{content:null,sha:null};
  if(!res.ok)throw new Error(`GitHub GET failed: ${res.status}`);
  const j=await res.json();
  if(!j.content)return{content:null,sha:j.sha||null};
  try{
    // atob returns raw bytes as a binary string; TextDecoder converts them as proper UTF-8.
    // Without this step any non-ASCII character (e.g. ·) is misread and corrupts on each cycle.
    const raw=atob(j.content.replace(/\n/g,""));
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const decoded=JSON.parse(new TextDecoder().decode(bytes));
    return{content:decoded,sha:j.sha};
  }catch{
    return{content:null,sha:j.sha||null};
  }
}
async function ghPut(cfg,data,sha){
  // GitHub requires the current SHA when updating an existing file.
  // If we don't have it (e.g. first load after switching devices), fetch it now.
  if(!sha){
    try{const g=await ghGet(cfg);sha=g.sha;}catch{}
  }
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`;
  const body={message:`sync: ${new Date().toISOString()}`,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),...(sha&&{sha})};
  const res=await fetch(url,{method:"PUT",headers:{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||`GitHub PUT failed: ${res.status}`);}
  const j=await res.json();return j.content.sha;
}

/* ---------- MFP CSV PARSER ---------- */
// Handles MFP Premium daily-summary export. Tolerates a few common column variants.
function parseMFPCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw new Error("CSV looks empty");
  const split=l=>{const r=[];let cur="",q=false;for(const c of l){if(c==='"'){q=!q;}else if(c===","&&!q){r.push(cur);cur="";}else{cur+=c;}}r.push(cur);return r.map(x=>x.trim());};
  const headers=split(lines[0]).map(h=>h.toLowerCase());
  const fi=names=>headers.findIndex(h=>names.some(n=>h.includes(n)));
  const di=fi(["date"]);
  const ci=fi(["calories","kcal"]);
  const pi=fi(["protein"]);
  const cbi=fi(["carbohydrate","carbs"]);
  const fti=fi(["fat"]);
  if(di<0||ci<0)throw new Error("CSV missing Date or Calories columns");
  const byDate={};
  for(let i=1;i<lines.length;i++){
    const row=split(lines[i]);
    if(!row[di])continue;
    const d=parseDateStr(row[di]);
    if(!d)continue;
    const num=v=>{const x=parseFloat(String(v).replace(/[^0-9.-]/g,""));return isNaN(x)?0:x;};
    if(!byDate[d])byDate[d]={date:d,kcal:0,protein:0,carbs:0,fat:0,source:"mfp"};
    byDate[d].kcal+=num(row[ci]);
    if(pi>=0)byDate[d].protein+=num(row[pi]);
    if(cbi>=0)byDate[d].carbs+=num(row[cbi]);
    if(fti>=0)byDate[d].fat+=num(row[fti]);
  }
  return Object.values(byDate).map(e=>({id:uid(),...e,kcal:Math.round(e.kcal),protein:Math.round(e.protein),carbs:Math.round(e.carbs),fat:Math.round(e.fat)}));
}
function parseDateStr(s){
  s=s.trim().replace(/"/g,"");
  // try ISO (YYYY-MM-DD)
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  // try DD/MM/YYYY or MM/DD/YYYY (assume DD/MM since user is UK)
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m)return `${m[3]}-${pad(parseInt(m[2]))}-${pad(parseInt(m[1]))}`;
  // try Date.parse fallback
  const d=new Date(s);
  if(!isNaN(d))return isoDate(d);
  return null;
}

/* ---------- STRAVA via Cloudflare Worker ---------- */
async function stravaAuth(workerUrl){
  // Worker handles full OAuth: redirect → callback → token exchange → returns refresh_token to us.
  // We open the worker's /authorize endpoint which will redirect back to /strava-callback in our origin.
  const redirect=window.location.origin+window.location.pathname.replace(/\/[^/]*$/,"/")+"index.html";
  window.location.href=`${workerUrl.replace(/\/$/,"")}/authorize?redirect_uri=${encodeURIComponent(redirect)}`;
}
async function stravaFetch(workerUrl,refreshToken,path){
  const res=await fetch(`${workerUrl.replace(/\/$/,"")}/api?path=${encodeURIComponent(path)}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:refreshToken}),
  });
  if(!res.ok)throw new Error(`Strava error: ${res.status}`);
  return res.json();
}
async function stravaPullActivities(workerUrl,refreshToken,sinceTs,onProgress){
  // Default lookback: 5 years on first sync; subsequent syncs use lastSync timestamp.
  const after=sinceTs
    ?Math.floor(sinceTs/1000)
    :Math.floor((Date.now()-1000*60*60*24*365*5)/1000);
  const all=[];
  let page=1;
  while(page<=50){  // hard cap at 5,000 activities
    if(onProgress)onProgress(all.length,page);
    const batch=await stravaFetch(workerUrl,refreshToken,
      `/api/v3/athlete/activities?after=${after}&per_page=100&page=${page}`);
    if(!Array.isArray(batch)||!batch.length)break;
    all.push(...batch);
    if(batch.length<100)break;  // last page
    page++;
  }
  return all.map(a=>({
    id:uid(),stravaId:a.id,
    date:a.start_date_local?a.start_date_local.slice(0,10):isoDate(a.start_date),
    type:a.sport_type||a.type,name:a.name,
    durationMin:Math.round((a.moving_time||0)/60),
    distanceKm:+(((a.distance||0)/1000).toFixed(2)),
    kj:a.kilojoules?Math.round(a.kilojoules):null,
    source:"strava",
  }));
}

/* ---------- SVG CHART PRIMITIVES ---------- */
function useChartHover(){
  const[tip,setTip]=useState(null);
  return[tip,setTip];
}

function LineChart({data,series,xKey="x",height=220,formatY=v=>Math.round(v),formatX=v=>v,refRange=null,phaseBands=null,showGrid=true,showLegend=true,unit=""}){
  const ref=useRef(null);
  const[tip,setTip]=useState(null);
  if(!data||!data.length)return <Empty msg="No data yet"/>;
  const W=720,H=height,L=44,R=14,T=14,B=34;
  const xs=data.map(d=>+new Date(d[xKey]));
  const xMin=Math.min(...xs),xMax=Math.max(...xs);
  const allY=[];
  series.forEach(s=>data.forEach(d=>{const v=d[s.key];if(v!=null&&!isNaN(v))allY.push(v);}));
  if(refRange){if(refRange.min!=null)allY.push(refRange.min);if(refRange.max!=null)allY.push(refRange.max);}
  if(!allY.length)return <Empty msg="No values"/>;
  let yMin=Math.min(...allY),yMax=Math.max(...allY);
  if(yMin===yMax){yMin-=1;yMax+=1;}
  const pad=(yMax-yMin)*0.1;yMin-=pad;yMax+=pad;
  if(yMin>0&&yMin<(yMax-yMin)*0.3)yMin=0;
  const sx=t=>L+(xMax===xMin?0:(t-xMin)/(xMax-xMin)*(W-L-R));
  const sy=v=>T+(1-(v-yMin)/(yMax-yMin))*(H-T-B);
  const ticks=4;
  const yTicks=Array.from({length:ticks+1},(_,i)=>yMin+(yMax-yMin)*i/ticks);
  const xTicks=Array.from({length:5},(_,i)=>xMin+(xMax-xMin)*i/4);

  function onMove(e){
    const rect=ref.current.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(W/rect.width);
    if(x<L||x>W-R){setTip(null);return;}
    const t=xMin+(x-L)/(W-L-R)*(xMax-xMin);
    let nearest=null,bestD=Infinity;
    data.forEach((d,i)=>{const dt=Math.abs(+new Date(d[xKey])-t);if(dt<bestD){bestD=dt;nearest={d,i};}});
    if(nearest)setTip({x:sx(+new Date(nearest.d[xKey])),d:nearest.d});
  }
  function onLeave(){setTip(null);}

  return(
    <div style={{position:"relative",width:"100%"}}>
      <svg ref={ref} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:"100%",height,display:"block",cursor:"crosshair"}} onMouseMove={onMove} onMouseLeave={onLeave} onTouchStart={onMove} onTouchMove={onMove} onTouchEnd={onLeave}>
        {phaseBands&&phaseBands.map((b,i)=>{
          const x1=sx(Math.max(xMin,+new Date(b.start)));
          const x2=sx(Math.min(xMax,+new Date(b.end||xMax)));
          if(x2<=x1)return null;
          return <rect key={i} x={x1} y={T} width={x2-x1} height={H-T-B} fill={b.color} fillOpacity={0.06}/>;
        })}
        {refRange&&(refRange.min!=null||refRange.max!=null)&&(()=>{
          const y1=refRange.max!=null?sy(refRange.max):T;
          const y2=refRange.min!=null?sy(refRange.min):H-B;
          return <rect x={L} y={Math.min(y1,y2)} width={W-L-R} height={Math.abs(y2-y1)} fill="#7fff6b" fillOpacity={0.05} stroke="#7fff6b" strokeOpacity={0.2} strokeDasharray="3 3"/>;
        })()}
        {showGrid&&yTicks.map((y,i)=><line key={i} x1={L} x2={W-R} y1={sy(y)} y2={sy(y)} stroke="rgba(255,255,255,0.04)"/>)}
        {yTicks.map((y,i)=><text key={i} x={L-6} y={sy(y)+4} textAnchor="end" fontSize="9" fill="rgba(255,255,255,0.4)" fontFamily="DM Mono">{formatY(y)}</text>)}
        {xTicks.map((t,i)=><text key={i} x={sx(t)} y={H-12} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,0.4)" fontFamily="DM Mono">{formatX(new Date(t))}</text>)}
        <line x1={L} x2={W-R} y1={H-B} y2={H-B} stroke="rgba(255,255,255,0.15)"/>
        <line x1={L} x2={L} y1={T} y2={H-B} stroke="rgba(255,255,255,0.15)"/>
        {series.map(s=>{
          const pts=data.filter(d=>d[s.key]!=null&&!isNaN(d[s.key])).map(d=>[sx(+new Date(d[xKey])),sy(d[s.key])]);
          if(!pts.length)return null;
          const path=pts.map((p,i)=>(i===0?"M":"L")+p[0]+","+p[1]).join(" ");
          return <g key={s.key}>
            <path d={path} fill="none" stroke={s.color} strokeWidth="1.7" strokeLinejoin="round" strokeLinecap="round" opacity="0.9"/>
            {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill={s.color} stroke="#080c12" strokeWidth="1"/>)}
          </g>;
        })}
        {tip&&<line x1={tip.x} x2={tip.x} y1={T} y2={H-B} stroke="rgba(0,212,255,0.4)" strokeDasharray="2 2"/>}
      </svg>
      {tip&&(()=>{
        const items=series.map(s=>({label:s.label,color:s.color,val:tip.d[s.key]})).filter(x=>x.val!=null);
        if(!items.length)return null;
        return <div className="chart-tip" style={{left:`${(tip.x/W)*100}%`,top:8,transform:`translateX(${tip.x>W*0.7?'-100%':tip.x<W*0.3?'0':'-50%'})`}}>
          <div style={{color:"var(--muted)",marginBottom:3}}>{fmt(tip.d[xKey])}</div>
          {items.map((it,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:it.color,display:"inline-block"}}/><span>{it.label}: <strong>{formatY(it.val)}{unit}</strong></span></div>)}
          {tip.d.cycle&&<div style={{color:"var(--muted)",marginTop:3,fontSize:10}}>{tip.d.cycle}</div>}
        </div>;
      })()}
      {showLegend&&series.length>1&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:6,fontSize:11}}>
          {series.map(s=><span key={s.key} style={{display:"flex",alignItems:"center",gap:5,color:"var(--muted)"}}><span style={{width:9,height:9,borderRadius:"50%",background:s.color,display:"inline-block",boxShadow:`0 0 6px ${s.color}`}}/>{s.label}</span>)}
        </div>
      )}
    </div>
  );
}

function StackedAreaChart({data,series,xKey="x",height=220,formatY=v=>Math.round(v),formatX=v=>v,phaseBands=null,unit=""}){
  const ref=useRef(null);const[tip,setTip]=useState(null);
  if(!data||!data.length)return <Empty msg="No data yet"/>;
  const W=720,H=height,L=44,R=14,T=14,B=34;
  const xs=data.map(d=>+new Date(d[xKey]));
  const xMin=Math.min(...xs),xMax=Math.max(...xs);
  const totals=data.map(d=>series.reduce((a,s)=>a+(d[s.key]||0),0));
  let yMax=Math.max(...totals,1);yMax*=1.1;
  const sx=t=>L+(xMax===xMin?0:(t-xMin)/(xMax-xMin)*(W-L-R));
  const sy=v=>T+(1-v/yMax)*(H-T-B);
  function onMove(e){const rect=ref.current.getBoundingClientRect();const x=(e.clientX-rect.left)*(W/rect.width);if(x<L||x>W-R){setTip(null);return;}const t=xMin+(x-L)/(W-L-R)*(xMax-xMin);let n=null,bd=Infinity;data.forEach(d=>{const dt=Math.abs(+new Date(d[xKey])-t);if(dt<bd){bd=dt;n=d;}});if(n)setTip({x:sx(+new Date(n[xKey])),d:n});}
  function onLeave(){setTip(null);}
  // build stacks
  const stacks=series.map((s,si)=>{
    return data.map((d,i)=>{
      let below=0;for(let j=0;j<si;j++)below+=(d[series[j].key]||0);
      const v=d[s.key]||0;return{x:sx(+new Date(d[xKey])),y0:sy(below),y1:sy(below+v)};
    });
  });
  const yTicks=Array.from({length:5},(_,i)=>yMax*i/4);
  const xTicks=Array.from({length:5},(_,i)=>xMin+(xMax-xMin)*i/4);
  return(
    <div style={{position:"relative",width:"100%"}}>
      <svg ref={ref} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:"100%",height,display:"block"}} onMouseMove={onMove} onMouseLeave={onLeave} onTouchStart={onMove} onTouchMove={onMove} onTouchEnd={onLeave}>
        {phaseBands&&phaseBands.map((b,i)=>{const x1=sx(Math.max(xMin,+new Date(b.start)));const x2=sx(Math.min(xMax,+new Date(b.end||xMax)));if(x2<=x1)return null;return <rect key={i} x={x1} y={T} width={x2-x1} height={H-T-B} fill={b.color} fillOpacity={0.06}/>;})}
        {yTicks.map((y,i)=><line key={i} x1={L} x2={W-R} y1={sy(y)} y2={sy(y)} stroke="rgba(255,255,255,0.04)"/>)}
        {yTicks.map((y,i)=><text key={i} x={L-6} y={sy(y)+4} textAnchor="end" fontSize="9" fill="rgba(255,255,255,0.4)" fontFamily="DM Mono">{formatY(y)}</text>)}
        {xTicks.map((t,i)=><text key={i} x={sx(t)} y={H-12} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,0.4)" fontFamily="DM Mono">{formatX(new Date(t))}</text>)}
        <line x1={L} x2={W-R} y1={H-B} y2={H-B} stroke="rgba(255,255,255,0.15)"/>
        <line x1={L} x2={L} y1={T} y2={H-B} stroke="rgba(255,255,255,0.15)"/>
        {series.map((s,si)=>{
          const pts=stacks[si];
          const top=pts.map((p,i)=>(i===0?"M":"L")+p.x+","+p.y1).join(" ");
          const bot=pts.slice().reverse().map(p=>"L"+p.x+","+p.y0).join(" ");
          return <path key={s.key} d={top+" "+bot+" Z"} fill={s.color} fillOpacity="0.55" stroke={s.color} strokeWidth="0.8"/>;
        })}
        {tip&&<line x1={tip.x} x2={tip.x} y1={T} y2={H-B} stroke="rgba(0,212,255,0.4)" strokeDasharray="2 2"/>}
      </svg>
      {tip&&(()=>{const items=series.map(s=>({label:s.label,color:s.color,val:tip.d[s.key]})).filter(x=>x.val);if(!items.length)return null;const total=items.reduce((a,x)=>a+x.val,0);return <div className="chart-tip" style={{left:`${(tip.x/W)*100}%`,top:8,transform:`translateX(${tip.x>W*0.7?'-100%':tip.x<W*0.3?'0':'-50%'})`}}>
        <div style={{color:"var(--muted)",marginBottom:3}}>{fmt(tip.d[xKey])}</div>
        {items.map((it,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:it.color}}/>{it.label}: <strong>{formatY(it.val)}{unit}</strong></div>)}
        <div style={{borderTop:"1px solid var(--border)",marginTop:4,paddingTop:3}}>Total: <strong>{formatY(total)}{unit}</strong></div>
      </div>;})()}
      <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:6,fontSize:11}}>
        {series.map(s=><span key={s.key} style={{display:"flex",alignItems:"center",gap:5,color:"var(--muted)"}}><span style={{width:9,height:9,borderRadius:"50%",background:s.color,boxShadow:`0 0 6px ${s.color}`}}/>{s.label}</span>)}
      </div>
    </div>
  );
}

function Empty({msg}){return <div style={{textAlign:"center",padding:"40px 0",color:"var(--muted)",fontSize:13}}>{msg}</div>;}

/* ---------- MAIN APP ---------- */
function App(){
  const[tab,setTab]=useState("dashboard");
  const[healthSubtab,setHealthSubtab]=useState("body");
  const[chartsSubtab,setChartsSubtab]=useState("doses");
  const[store,setStore]=useState(emptyStore());
  const[modal,setModal]=useState(null);
  const[ghConfig,setGhConfig]=useState({owner:"",repo:"TRT",token:""});
  const[stravaConfig,setStravaConfig]=useState({workerUrl:"",refreshToken:"",lastSync:null});
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncMsg,setSyncMsg]=useState("");
  const shaRef=useRef(null);
  const saveTimer=useRef(null);
  const loaded=useRef(false);

  const setStorePart=(k,fn)=>setStore(s=>({...s,[k]:fn(s[k])}));
  const isGhConfigured=()=>ghConfig.owner&&ghConfig.repo&&ghConfig.token;

  /* ---------- LOAD ---------- */
  useEffect(()=>{
    try{
      const sc=JSON.parse(localStorage.getItem(STRAVA_CONFIG_KEY)||"{}");
      if(sc.workerUrl)setStravaConfig({workerUrl:sc.workerUrl||"",refreshToken:sc.refreshToken||"",lastSync:sc.lastSync||null});
    }catch{}
    // Strava OAuth callback — read from localStorage directly because React state
    // hasn't flushed yet here, so spreading stravaConfig would lose workerUrl.
    const params=new URLSearchParams(window.location.search);
    if(params.get("strava_refresh")){
      const rt=params.get("strava_refresh");
      const saved=JSON.parse(localStorage.getItem(STRAVA_CONFIG_KEY)||"{}");
      const cfg={...saved,refreshToken:rt};
      setStravaConfig(cfg);
      localStorage.setItem(STRAVA_CONFIG_KEY,JSON.stringify(cfg));
      window.history.replaceState({},"",window.location.pathname);
    }
    try{
      const savedCfg=JSON.parse(localStorage.getItem(GH_CONFIG_KEY));
      if(savedCfg?.token){setGhConfig(savedCfg);loadFromGitHub(savedCfg);return;}
    }catch{}
    loadFromLocal();
  },[]);

  function loadFromLocal(){
    let data=null;
    try{data=JSON.parse(localStorage.getItem(LOCAL_KEY));}catch{}
    if(!data){
      // try v1 migration
      try{
        const v1=JSON.parse(localStorage.getItem(LEGACY_KEY));
        if(v1)data=migrateV1(v1);
      }catch{}
    }
    if(data)setStore(normalize(data));
    loaded.current=true;
  }

  async function loadFromGitHub(cfg){
    setSyncStatus("syncing");setSyncMsg("Fetching from GitHub…");
    try{
      const{content,sha}=await ghGet(cfg);
      if(content){
        setStore(normalize(content.schemaVersion?content:migrateV1(content)));
        shaRef.current=sha;setSyncStatus("ok");
        setSyncMsg(`Loaded · ${new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`);
      }else{
        loadFromLocal();setSyncStatus("ok");setSyncMsg("Connected · no remote data yet");
      }
    }catch(e){setSyncStatus("error");setSyncMsg(`GitHub: ${e.message}`);loadFromLocal();}
    loaded.current=true;
  }

  function normalize(d){
    return{
      compounds:d.compounds||[],
      logs:d.logs||[],
      cycles:d.cycles||[],
      bodyMetrics:d.bodyMetrics||[],
      bloods:d.bloods||[],
      macros:d.macros||[],
      activities:d.activities||[],
      schemaVersion:SCHEMA_VERSION,
    };
  }

  /* ---------- SAVE ---------- */
  const persist=useCallback(s=>{
    if(!loaded.current)return;
    localStorage.setItem(LOCAL_KEY,JSON.stringify(s));
    if(isGhConfigured()){
      clearTimeout(saveTimer.current);
      saveTimer.current=setTimeout(()=>pushToGitHub(s),1500);
    }
  },[ghConfig]);

  async function pushToGitHub(s){
    setSyncStatus("syncing");setSyncMsg("Saving to GitHub…");
    try{const newSha=await ghPut(ghConfig,s,shaRef.current);shaRef.current=newSha;setSyncStatus("ok");setSyncMsg(`Synced · ${new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`);}
    catch(e){setSyncStatus("error");setSyncMsg(`Sync: ${e.message}`);}
  }
  useEffect(()=>{persist(store);},[store]);

  async function manualSync(){
    if(!isGhConfigured()){setModal({type:"settings"});return;}
    setSyncStatus("syncing");setSyncMsg("Pulling…");
    try{const{content,sha}=await ghGet(ghConfig);if(content){setStore(normalize(content));shaRef.current=sha;setSyncStatus("ok");setSyncMsg(`Pulled · ${new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`);}}
    catch(e){setSyncStatus("error");setSyncMsg(`Sync: ${e.message}`);}
  }

  function saveGhConfig(cfg){
    localStorage.setItem(GH_CONFIG_KEY,JSON.stringify(cfg));
    setGhConfig(cfg);loadFromGitHub(cfg);
  }
  function clearGhConfig(){
    localStorage.removeItem(GH_CONFIG_KEY);
    setGhConfig({owner:"",repo:"TRT",token:""});shaRef.current=null;
    setSyncStatus("idle");setSyncMsg("");
  }

  /* ---------- ACTIONS ---------- */
  function addLog(form){
    const c=store.compounds.find(x=>x.id===form.compoundId);
    if(!c||!form.dose)return;
    setStorePart("logs",l=>[{
      id:uid(),compoundId:c.id,compoundName:c.name,dose:parseFloat(form.dose),unit:c.unit,
      site:form.site||"",notes:form.notes||"",
      datetime:form.datetime?new Date(form.datetime).toISOString():new Date().toISOString(),
      color:c.color,type:c.type,
    },...l]);
    setModal(null);
  }
  function addCompound(form){
    if(!form.name||!form.defaultDose)return;
    setStorePart("compounds",c=>[...c,{...form,id:uid(),defaultDose:parseFloat(form.defaultDose)}]);
    setModal(null);
  }
  function addCycle(form){
    if(!form.name||!form.startDate)return;
    setStorePart("cycles",c=>[...c,{...form,id:uid()}]);
    setModal(null);
  }
  function updateCycle(id,form){
    setStorePart("cycles",c=>c.map(x=>x.id===id?{...x,...form}:x));setModal(null);
  }
  function addBody(form){
    if(!form.date||(!form.weight&&!form.bf))return;
    const w=form.weight?parseFloat(form.weight):null;
    const bf=form.bf?parseFloat(form.bf)/100:null;
    setStorePart("bodyMetrics",b=>[{id:uid(),date:form.date,weight:w,bf,notes:form.notes||""},...b.filter(x=>x.date!==form.date)].sort((a,b)=>b.date.localeCompare(a.date)));
    setModal(null);
  }
  function addBloods(form){
    if(!form.date)return;
    const e={id:uid(),date:form.date};
    if(form.bp_sys)e.bp_sys=parseFloat(form.bp_sys);
    if(form.bp_dia)e.bp_dia=parseFloat(form.bp_dia);
    BLOOD_KEYS.forEach(k=>{if(form[k]!==""&&form[k]!=null&&!isNaN(parseFloat(form[k])))e[k]=parseFloat(form[k]);});
    if(form.notes)e.notes=form.notes;
    setStorePart("bloods",b=>[e,...b.filter(x=>x.date!==form.date||x.id===form.id)].sort((a,b)=>b.date.localeCompare(a.date)));
    setModal(null);
  }
  function addMacros(form){
    if(!form.date||!form.kcal)return;
    const e={id:uid(),date:form.date,kcal:parseFloat(form.kcal),protein:parseFloat(form.protein||0),carbs:parseFloat(form.carbs||0),fat:parseFloat(form.fat||0),source:"manual"};
    setStorePart("macros",m=>[e,...m.filter(x=>x.date!==form.date)].sort((a,b)=>b.date.localeCompare(a.date)));
    setModal(null);
  }
  async function importMfpCsv(file){
    try{const text=await file.text();const rows=parseMFPCsv(text);
      if(!rows.length){alert("No rows parsed from this CSV");return;}
      setStorePart("macros",m=>{
        const dates=new Set(rows.map(r=>r.date));
        return[...rows,...m.filter(x=>!dates.has(x.date))].sort((a,b)=>b.date.localeCompare(a.date));
      });
      alert(`Imported ${rows.length} days of macros from MFP.`);
    }catch(e){alert("CSV import failed: "+e.message);}
  }
  async function _doStravaSync(sinceTs,replaceAll){
    if(!stravaConfig.workerUrl||!stravaConfig.refreshToken){
      alert("Configure Strava in Settings first.");return;
    }
    try{
      setSyncStatus("syncing");setSyncMsg("Pulling Strava activities…");
      const acts=await stravaPullActivities(
        stravaConfig.workerUrl,stravaConfig.refreshToken,sinceTs,
        (loaded,page)=>setSyncMsg(`Fetching Strava… page ${page} (${loaded} so far)`));
      if(replaceAll){
        // Full resync — replace everything
        setStorePart("activities",()=>[...acts].sort((x,y)=>y.date.localeCompare(x.date)));
      }else{
        const existing=new Set(store.activities.map(a=>a.stravaId));
        const fresh=acts.filter(a=>!existing.has(a.stravaId));
        setStorePart("activities",a=>[...fresh,...a].sort((x,y)=>y.date.localeCompare(x.date)));
      }
      const newCfg={...stravaConfig,lastSync:Date.now()};
      setStravaConfig(newCfg);localStorage.setItem(STRAVA_CONFIG_KEY,JSON.stringify(newCfg));
      setSyncStatus("ok");setSyncMsg(`Strava: ${acts.length} activities loaded`);
    }catch(e){setSyncStatus("error");setSyncMsg(`Strava: ${e.message}`);}
  }
  // Incremental — only fetches since last sync
  async function syncStrava(){return _doStravaSync(stravaConfig.lastSync,false);}
  // Full resync — ignores lastSync, replaces all stored activities
  async function syncStravaFull(){return _doStravaSync(null,true);}
  async function importHistorical(){
    try{
      setSyncStatus("syncing");setSyncMsg("Loading historical data…");
      const r=await fetch("./seed-data.json",{cache:"no-store"});
      if(!r.ok)throw new Error("seed-data.json not found in this folder");
      const seed=await r.json();
      // map compound names to IDs we have
      const byName={};store.compounds.forEach(c=>{byName[c.name.toLowerCase()]=c;});
      // Pre-seed any missing canonical compounds
      let newCompounds=[...store.compounds];
      SEEDED_COMPOUNDS.forEach(sc=>{if(!byName[sc.name.toLowerCase()]){newCompounds.push({...sc});byName[sc.name.toLowerCase()]=sc;}});
      // map xlsx logs to event-shaped logs
      const newLogs=seed.logs.map(l=>{
        const c=byName[l.compound.toLowerCase()];
        if(!c)return null;
        return{id:uid(),compoundId:c.id,compoundName:c.name,dose:l.dose,unit:l.unit,
          site:"",notes:`imported - ${l.cycle}`,
          datetime:new Date(l.date+"T09:00:00").toISOString(),
          color:c.color,type:c.type};
      }).filter(Boolean);
      const newCycles=seed.cycles.map(c=>({id:uid(),name:c.name,phase:c.phase||"cut",startDate:c.startDate,endDate:c.endDate,notes:""}));
      const newBody=seed.bodyMetrics.map(b=>({id:uid(),date:b.date,weight:b.weight,bf:b.bf,notes:""}));
      const newBloods=seed.bloods.map(b=>({id:uid(),...b}));
      // merge — avoid duplicates
      setStore(s=>{
        const lDates=new Set(s.logs.map(x=>x.datetime.slice(0,10)+x.compoundId));
        const bDates=new Set(s.bodyMetrics.map(x=>x.date));
        const blDates=new Set(s.bloods.map(x=>x.date));
        return{
          ...s,
          compounds:newCompounds,
          logs:[...s.logs,...newLogs.filter(l=>!lDates.has(l.datetime.slice(0,10)+l.compoundId))].sort((a,b)=>b.datetime.localeCompare(a.datetime)),
          cycles:[...s.cycles,...newCycles].filter((c,i,a)=>a.findIndex(x=>x.name===c.name)===i),
          bodyMetrics:[...newBody.filter(b=>!bDates.has(b.date)),...s.bodyMetrics].sort((a,b)=>b.date.localeCompare(a.date)),
          bloods:[...newBloods.filter(b=>!blDates.has(b.date)),...s.bloods].sort((a,b)=>b.date.localeCompare(a.date)),
        };
      });
      setSyncStatus("ok");setSyncMsg(`Imported ${newLogs.length} doses, ${newBody.length} body, ${newBloods.length} bloods, ${newCycles.length} cycles`);
      setModal(null);
    }catch(e){setSyncStatus("error");setSyncMsg(`Import: ${e.message}`);alert("Import failed: "+e.message);}
  }
  function addMissingSeededCompounds(){
    const have=new Set(store.compounds.map(c=>c.name.toLowerCase()));
    const missing=SEEDED_COMPOUNDS.filter(s=>!have.has(s.name.toLowerCase()));
    if(!missing.length){alert("All seeded compounds are already added.");return;}
    setStorePart("compounds",c=>[...c,...missing.map(m=>({...m,id:uid()}))]);
    alert(`Added ${missing.length} compounds.`);
  }

  /* ---------- DERIVED ---------- */
  const last7=store.logs.filter(l=>daysSince(l.datetime)<7);
  const lastFor=id=>store.logs.find(l=>l.compoundId===id);
  const recentSites=store.logs.slice(0,10).map(l=>l.site).filter(Boolean);
  const nextSite=INJECTION_SITES.find(s=>!recentSites.slice(0,4).includes(s))||INJECTION_SITES[0];
  const sortedCycles=useMemo(()=>[...store.cycles].sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||"")),[store.cycles]);
  const activeCycle=useMemo(()=>{const t=today();return sortedCycles.find(c=>c.startDate<=t&&(!c.endDate||c.endDate>=t));},[sortedCycles]);
  const phaseBands=useMemo(()=>sortedCycles.map(c=>({start:c.startDate,end:c.endDate||today(),color:phaseColor(c.phase),label:c.name})),[sortedCycles]);

  /* ---------- RENDER ---------- */
  const SyncBar=()=>(
    <div style={S.syncBar(syncStatus)}>
      {syncStatus==="syncing"&&<span className="spin">⟳</span>}
      {syncStatus==="ok"&&<span>✓</span>}

      <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis"}}>{syncMsg||(isGhConfigured()?"GitHub connected":"Local only — tap Connect to sync")}</span>
      <button onClick={manualSync} style={{...S.btn(),padding:"4px 10px",fontSize:9}}>{isGhConfigured()?"↺":"Connect"}</button>
      <button onClick={()=>setModal({type:"settings"})} style={{...S.btnCancel,padding:"4px 8px",fontSize:10,marginRight:0}}>⚙</button>
    </div>
  );

  return(
    <div style={S.app}>
      <div style={S.bgGlow}/>
      <div style={S.wrap}>
        <div style={S.header}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={S.logo}>⬡ Protocol</div>
              <div style={S.subtitle}>TRT · Cycle · Health Tracker</div>
            </div>
            {activeCycle&&<div style={{textAlign:"right"}}>
              <div style={{fontSize:9,color:"var(--muted)",letterSpacing:"0.15em",textTransform:"uppercase"}}>Active Cycle</div>
              <div style={{fontSize:14,fontWeight:700,color:phaseColor(activeCycle.phase),marginTop:2}}>{activeCycle.name}</div>
              <div style={{fontSize:10,color:"var(--muted)"}}>Week {Math.floor(daysSince(activeCycle.startDate)/7)+1}</div>
            </div>}
          </div>
          <nav style={S.nav}>
            {[["dashboard","Dash"],["log","Log"],["cycles","Cycles"],["health","Health"],["charts","Charts"],["protocols","Protocols"]].map(([k,l])=>(
              <button key={k} style={S.navBtn(tab===k)} onClick={()=>setTab(k)}>{l}</button>
            ))}
          </nav>
        </div>

        <SyncBar/>

        {tab==="dashboard"&&<DashboardTab store={store} last7={last7} nextSite={nextSite} lastFor={lastFor} activeCycle={activeCycle} openLog={(c)=>setModal({type:"log",compound:c})}/>}
        {tab==="log"&&<LogTab store={store} setStore={setStore} setStorePart={setStorePart}/>}
        {tab==="cycles"&&<CyclesTab cycles={sortedCycles} store={store} setModal={setModal} setStorePart={setStorePart}/>}
        {tab==="health"&&<HealthTab store={store} setStore={setStore} setStorePart={setStorePart} subtab={healthSubtab} setSubtab={setHealthSubtab} setModal={setModal} stravaConfig={stravaConfig} syncStrava={syncStrava} syncStravaFull={syncStravaFull} importMfpCsv={importMfpCsv}/>}
        {tab==="charts"&&<ChartsTab store={store} subtab={chartsSubtab} setSubtab={setChartsSubtab} phaseBands={phaseBands}/>}
        {tab==="protocols"&&<ProtocolsTab store={store} setStorePart={setStorePart} setModal={setModal} addMissingSeeded={addMissingSeededCompounds}/>}
      </div>

      <button className="fab" style={S.fab} onClick={()=>setModal({type:"log"})} title="Log injection">+</button>

      {modal&&<Modals modal={modal} setModal={setModal} store={store} ghConfig={ghConfig} saveGhConfig={saveGhConfig} clearGhConfig={clearGhConfig} stravaConfig={stravaConfig} setStravaConfig={setStravaConfig} addLog={addLog} addCompound={addCompound} addCycle={addCycle} updateCycle={updateCycle} addBody={addBody} addBloods={addBloods} addMacros={addMacros} importHistorical={importHistorical} syncStrava={syncStrava}/>}
    </div>
  );
}

function LogTab({store,setStorePart}){
  const[sortAsc,setSortAsc]=useState(false);
  const[filterCompound,setFilterCompound]=useState("all");
  const PAGE=100;
  const[page,setPage]=useState(1);

  const compounds=[...new Set(store.logs.map(l=>l.compoundName))].sort();

  const filtered=useMemo(()=>{
    let ls=[...store.logs];
    if(filterCompound!=="all")ls=ls.filter(l=>l.compoundName===filterCompound);
    ls.sort((a,b)=>{
      const cmp=a.datetime.localeCompare(b.datetime);
      return sortAsc?cmp:-cmp;
    });
    return ls;
  },[store.logs,filterCompound,sortAsc]);

  const visible=filtered.slice(0,page*PAGE);
  const hasMore=filtered.length>visible.length;

  // reset page when filter/sort changes
  React.useEffect(()=>setPage(1),[filterCompound,sortAsc]);

  return(<>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:12}}>
      <div style={S.sectionH}>Injection History ({filtered.length}{filterCompound!=="all"?"/"+store.logs.length:""})</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <select style={{...S.select,marginBottom:0,padding:"6px 10px",fontSize:11,width:"auto"}}
          value={filterCompound} onChange={e=>setFilterCompound(e.target.value)}>
          <option value="all">All compounds</option>
          {compounds.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <button style={{...S.subnavBtn(true),borderColor:"rgba(0,212,255,0.3)",color:"var(--accent)",background:"rgba(0,212,255,0.08)"}}
          onClick={()=>setSortAsc(a=>!a)}
          title="Toggle sort direction">
          {sortAsc?"↑ Oldest first":"↓ Newest first"}
        </button>
      </div>
    </div>
    {filtered.length===0&&<Empty msg={filterCompound!=="all"?"No entries for this compound":"No doses yet — tap + to log one"}/>}
    {visible.map(l=>(
      <div key={l.id} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 0",borderBottom:"1px solid var(--border)"}}>
        <div style={{...S.dot(l.color),marginTop:4}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13}}>{l.compoundName}</div>
          <div style={{fontSize:12,color:"var(--accent)",marginTop:1}}>{l.dose} {l.unit}</div>
          {l.site&&<div style={{fontSize:11,color:"var(--muted)",marginTop:1}}>{l.site}</div>}
          {l.notes&&<div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:1,fontStyle:"italic"}}>{l.notes}</div>}
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:11,color:"var(--muted)"}}>{fmtShort(l.datetime)}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:1}}>{fmtT(l.datetime)}</div>
          <button style={{...S.btnDanger,marginTop:4}} onClick={()=>setStorePart("logs",ls=>ls.filter(x=>x.id!==l.id))}>remove</button>
        </div>
      </div>
    ))}
    {hasMore&&(
      <button onClick={()=>setPage(p=>p+1)}
        style={{...S.btnCancel,width:"100%",textAlign:"center",marginTop:12,padding:"12px"}}>
        Load more ({filtered.length-visible.length} remaining)
      </button>
    )}
  </>);
}

function CyclesTab({cycles,store,setModal,setStorePart}){
  return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div style={S.sectionH}>Cycles ({cycles.length})</div>
      <button style={S.btn()} onClick={()=>setModal({type:"cycle"})}>+ Cycle</button>
    </div>
    {cycles.length===0&&<Empty msg="No cycles yet — add a Cut, Grow, or Maintenance phase"/>}
    {cycles.map(c=>{
      const start=new Date(c.startDate),end=c.endDate?new Date(c.endDate):new Date();
      const weeks=Math.max(1,Math.round((end-start)/(86400000*7)));
      // stats per cycle
      const inLogs=store.logs.filter(l=>l.datetime>=c.startDate&&(!c.endDate||l.datetime<=c.endDate+"T23:59:59"));
      const totals={};inLogs.forEach(l=>{totals[l.compoundName]=(totals[l.compoundName]||0)+l.dose;});
      const bodyIn=store.bodyMetrics.filter(b=>b.date>=c.startDate&&(!c.endDate||b.date<=c.endDate));
      const wStart=bodyIn[bodyIn.length-1]?.weight,wEnd=bodyIn[0]?.weight;
      const bfStart=bodyIn[bodyIn.length-1]?.bf,bfEnd=bodyIn[0]?.bf;
      const col=phaseColor(c.phase);
      return(
        <div key={c.id} style={{...S.card,borderColor:`${col}33`}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={S.dot(col)}/>
              <div>
                <div style={{fontSize:15,fontWeight:700}}>{c.name}</div>
                <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{fmt(c.startDate)} → {c.endDate?fmt(c.endDate):"ongoing"} · {weeks} weeks</div>
              </div>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <div style={S.tag(col)}>{(PHASE_OPTIONS.find(p=>p.value===c.phase)||{}).label||c.phase}</div>
              <button style={{...S.btnCancel,padding:"5px 10px",fontSize:10,marginRight:0}} onClick={()=>setModal({type:"cycle",cycle:c})}>edit</button>
              <button style={{...S.btnDanger,padding:"4px 6px"}} onClick={()=>{if(confirm("Delete this cycle?"))setStorePart("cycles",cs=>cs.filter(x=>x.id!==c.id));}}>✕</button>
            </div>
          </div>
          {(wStart||bfStart)&&<div style={{display:"flex",gap:18,fontSize:12,marginBottom:8,flexWrap:"wrap"}}>
            {wStart&&wEnd&&<span><span style={{color:"var(--muted)"}}>Weight:</span> <strong>{wStart.toFixed(1)}→{wEnd.toFixed(1)}kg</strong> <span style={{color:wEnd-wStart>0?"#7fff6b":"#ff6b35"}}>({(wEnd-wStart>0?"+":"")+(wEnd-wStart).toFixed(1)})</span></span>}
            {bfStart&&bfEnd&&<span><span style={{color:"var(--muted)"}}>BF:</span> <strong>{(bfStart*100).toFixed(1)}→{(bfEnd*100).toFixed(1)}%</strong> <span style={{color:bfEnd-bfStart<0?"#7fff6b":"#ff6b35"}}>({(bfEnd-bfStart>0?"+":"")+((bfEnd-bfStart)*100).toFixed(1)})</span></span>}
          </div>}
          {Object.keys(totals).length>0&&<details style={{fontSize:11,color:"var(--muted)"}}>
            <summary style={{cursor:"pointer"}}>Compound totals ({Object.keys(totals).length})</summary>
            <div style={{marginTop:8,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:6}}>
              {Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([n,t])=><div key={n} style={{display:"flex",justifyContent:"space-between",fontFamily:"DM Mono"}}><span>{n}:</span><strong style={{color:"var(--text)"}}>{Math.round(t)}{t>10?"":"."}{store.compounds.find(x=>x.name===n)?.unit||"mg"}</strong></div>)}
            </div>
          </details>}
          {c.notes&&<div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:8,fontStyle:"italic"}}>{c.notes}</div>}
        </div>
      );
    })}
  </>);
}

function BloodsSection({store,setStorePart,setModal}){
  const sorted=[...store.bloods].sort((a,b)=>a.date.localeCompare(b.date));
  return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={S.sectionH}>Blood Panels ({store.bloods.length})</div>
      <button style={S.btn()} onClick={()=>setModal({type:"bloods"})}>+ Panel</button>
    </div>
    {store.bloods.length===0&&<Empty msg="Log your first blood panel"/>}
    {BLOOD_KEYS.map(k=>{
      const r=NHS_RANGES[k];
      const data=sorted.filter(e=>e[k]!=null).map(e=>({x:e.date,[k]:e[k]}));
      if(!data.length)return null;
      const latest=data[data.length-1][k];
      const inRange=(r.min==null||latest>=r.min)&&(r.max==null||latest<=r.max);
      return <div key={k} style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>{r.label}</div>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:1}}>NHS range: {r.min??"—"} – {r.max??"—"} {r.unit}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:18,fontWeight:700,color:inRange?"#7fff6b":"#ff6b35"}}>{latest} <span style={{fontSize:10,opacity:0.6}}>{r.unit}</span></div>
            <div style={{fontSize:9,color:"var(--muted)",marginTop:1}}>{inRange?"✓ in range":"⚠ out of range"}</div>
          </div>
        </div>
        <LineChart data={data} series={[{key:k,color:inRange?"#7fff6b":"#ff6b35",label:r.label}]} refRange={{min:r.min,max:r.max}} height={150} formatY={v=>v.toFixed(v<10?2:1)} formatX={d=>d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})} unit={" "+r.unit} showLegend={false}/>
      </div>;
    })}
    <div style={{...S.card,marginTop:12}}>
      <div style={S.sectionH}>Recent Panels</div>
      {store.bloods.slice(0,10).map(b=>(
        <div key={b.id} style={{padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:12,fontWeight:700}}>{fmt(b.date)}</div>
            <button style={S.btnDanger} onClick={()=>setStorePart("bloods",bs=>bs.filter(x=>x.id!==b.id))}>remove</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:4,marginTop:4,fontSize:11}}>
            {b.bp_sys&&<span><span style={{color:"var(--muted)"}}>BP:</span> {b.bp_sys}/{b.bp_dia}</span>}
            {BLOOD_KEYS.map(k=>b[k]!=null?<span key={k}><span style={{color:"var(--muted)"}}>{k.toUpperCase()}:</span> {b[k]}</span>:null)}
          </div>
        </div>
      ))}
    </div>
  </>);
}

function DosesChart({store,phaseBands}){
  const[mode,setMode]=useState("lines");
  // weekly mg per compound (mg-unit only by default)
  const data=useMemo(()=>{
    const weeks={};
    store.logs.forEach(l=>{
      const wk=weekKey(l.datetime);
      if(!weeks[wk])weeks[wk]={x:wk};
      weeks[wk][l.compoundName]=(weeks[wk][l.compoundName]||0)+l.dose;
    });
    return Object.values(weeks).sort((a,b)=>a.x.localeCompare(b.x));
  },[store.logs]);
  const compounds=useMemo(()=>{
    const names=new Set(store.logs.map(l=>l.compoundName));
    return Array.from(names).map((n,i)=>{const c=store.compounds.find(x=>x.name===n);return{key:n,label:n,color:c?c.color:SWATCHES[i%SWATCHES.length],unit:c?c.unit:"mg"};});
  },[store.logs,store.compounds]);
  // group by unit
  const byUnit={};compounds.forEach(c=>{(byUnit[c.unit]||(byUnit[c.unit]=[])).push(c);});

  if(!data.length)return <Empty msg="No dose history yet"/>;
  return(<>
    <div style={{display:"flex",gap:6,marginBottom:14,justifyContent:"flex-end"}}>
      <button style={S.subnavBtn(mode==="lines")} onClick={()=>setMode("lines")}>Lines</button>
      <button style={S.subnavBtn(mode==="stack")} onClick={()=>setMode("stack")}>Stacked</button>
    </div>
    {Object.entries(byUnit).map(([unit,cs])=>(
      <div key={unit} style={S.card}>
        <div style={S.sectionH}>Weekly Total · {unit}</div>
        {mode==="lines"
          ?<LineChart data={data} series={cs} formatY={v=>v<10?v.toFixed(1):Math.round(v)} formatX={d=>d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})} phaseBands={phaseBands} unit={" "+unit}/>
          :<StackedAreaChart data={data} series={cs} formatY={v=>Math.round(v)} formatX={d=>d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})} phaseBands={phaseBands} unit={" "+unit}/>
        }
      </div>
    ))}
    {phaseBands.length>0&&<div style={{display:"flex",gap:14,fontSize:10,color:"var(--muted)",flexWrap:"wrap",justifyContent:"center",marginTop:6}}>
      {phaseBands.map((b,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:18,height:8,background:b.color,opacity:0.5,borderRadius:2}}/>{b.label}</span>)}
    </div>}
  </>);
}

function Modals({modal,setModal,store,ghConfig,saveGhConfig,clearGhConfig,stravaConfig,setStravaConfig,addLog,addCompound,addCycle,updateCycle,addBody,addBloods,addMacros,importHistorical,syncStrava}){
  const close=()=>setModal(null);
  const wrap=children=><div style={S.modal} onClick={e=>e.target===e.currentTarget&&close()}><div style={S.modalBox}>{children}</div></div>;

  if(modal.type==="log")return wrap(<LogModal store={store} compound={modal.compound} onClose={close} onSave={addLog}/>);
  if(modal.type==="compound")return wrap(<CompoundModal onClose={close} onSave={addCompound}/>);
  if(modal.type==="cycle")return wrap(<CycleModal cycle={modal.cycle} onClose={close} onSave={(f)=>modal.cycle?updateCycle(modal.cycle.id,f):addCycle(f)}/>);
  if(modal.type==="body")return wrap(<BodyModal onClose={close} onSave={addBody}/>);
  if(modal.type==="bloods")return wrap(<BloodsModal bpOnly={modal.bpOnly} onClose={close} onSave={addBloods}/>);
  if(modal.type==="macros")return wrap(<MacrosModal onClose={close} onSave={addMacros}/>);
  if(modal.type==="import")return wrap(<ImportModal onClose={close} onConfirm={importHistorical}/>);
  if(modal.type==="settings")return wrap(<SettingsModal ghConfig={ghConfig} stravaConfig={stravaConfig} setStravaConfig={setStravaConfig} onSave={saveGhConfig} onClear={clearGhConfig} onClose={close}/>);
  return null;
}

  return(<>
    <div style={S.modalTitle}>Log Weight & BF</div>
    <label style={S.label}>Date</label><input style={S.input} type="date" value={f.date} onChange={e=>setF(p=>({...p,date:e.target.value}))}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <div><label style={S.label}>Weight (kg)</label><input style={S.input} type="number" step="0.1" inputMode="decimal" value={f.weight} onChange={e=>setF(p=>({...p,weight:e.target.value}))}/></div>
      <div><label style={S.label}>BF (%)</label><input style={S.input} type="number" step="0.1" inputMode="decimal" value={f.bf} onChange={e=>setF(p=>({...p,bf:e.target.value}))}/></div>
    </div>
    <label style={S.label}>Notes</label><input style={S.input} placeholder="optional" value={f.notes} onChange={e=>setF(p=>({...p,notes:e.target.value}))}/>
    <Buttons onClose={onClose} onSave={()=>onSave(f)} saveLabel="Save"/>
  </>);
}

function BloodsModal({bpOnly,onClose,onSave}){
  const[f,setF]=useState({date:today(),bp_sys:"",bp_dia:"",notes:"",...Object.fromEntries(BLOOD_KEYS.map(k=>[k,""]))});
  return(<>
    <div style={S.modalTitle}>{bpOnly?"Log BP":"Log Blood Panel"}</div>
    <label style={S.label}>Date</label><input style={S.input} type="date" value={f.date} onChange={e=>setF(p=>({...p,date:e.target.value}))}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <div><label style={S.label}>BP Systolic</label><input style={S.input} type="number" inputMode="numeric" value={f.bp_sys} onChange={e=>setF(p=>({...p,bp_sys:e.target.value}))}/></div>
      <div><label style={S.label}>BP Diastolic</label><input style={S.input} type="number" inputMode="numeric" value={f.bp_dia} onChange={e=>setF(p=>({...p,bp_dia:e.target.value}))}/></div>
    </div>
    {!bpOnly&&<>
      <div style={{fontSize:10,color:"var(--muted)",letterSpacing:"0.15em",textTransform:"uppercase",marginTop:8,marginBottom:6}}>Hormone Panel</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {["test","shbg","freeAndro","lh","oest","prolactin","fsh","albumin"].map(k=>{const r=NHS_RANGES[k];return<div key={k}><label style={{...S.label,marginBottom:3}}>{r.label} <span style={{textTransform:"none",color:"rgba(255,255,255,0.25)"}}>({r.unit})</span></label><input style={{...S.input,marginBottom:8}} type="number" step="any" inputMode="decimal" value={f[k]} onChange={e=>setF(p=>({...p,[k]:e.target.value}))}/></div>;})}
      </div>
      <div style={{fontSize:10,color:"var(--muted)",letterSpacing:"0.15em",textTransform:"uppercase",marginTop:8,marginBottom:6}}>Lipids & Liver</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {["hdl","ldl","totalChol","alt","ast"].map(k=>{const r=NHS_RANGES[k];return<div key={k}><label style={{...S.label,marginBottom:3}}>{r.label} <span style={{textTransform:"none",color:"rgba(255,255,255,0.25)"}}>({r.unit})</span></label><input style={{...S.input,marginBottom:8}} type="number" step="any" inputMode="decimal" value={f[k]} onChange={e=>setF(p=>({...p,[k]:e.target.value}))}/></div>;})}
      </div>
    </>}
    <Buttons onClose={onClose} onSave={()=>onSave(f)} saveLabel="Save"/>
  </>);
}

function MacrosModal({onClose,onSave}){
  const[f,setF]=useState({date:today(),kcal:"",protein:"",carbs:"",fat:""});
  return(<>
    <div style={S.modalTitle}>Log Macros</div>
    <label style={S.label}>Date</label><input style={S.input} type="date" value={f.date} onChange={e=>setF(p=>({...p,date:e.target.value}))}/>
    <label style={S.label}>Calories (kcal)</label><input style={S.input} type="number" inputMode="numeric" value={f.kcal} onChange={e=>setF(p=>({...p,kcal:e.target.value}))}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
      <div><label style={S.label}>Protein (g)</label><input style={S.input} type="number" inputMode="numeric" value={f.protein} onChange={e=>setF(p=>({...p,protein:e.target.value}))}/></div>
      <div><label style={S.label}>Carbs (g)</label><input style={S.input} type="number" inputMode="numeric" value={f.carbs} onChange={e=>setF(p=>({...p,carbs:e.target.value}))}/></div>
      <div><label style={S.label}>Fat (g)</label><input style={S.input} type="number" inputMode="numeric" value={f.fat} onChange={e=>setF(p=>({...p,fat:e.target.value}))}/></div>
    </div>
    <Buttons onClose={onClose} onSave={()=>onSave(f)} saveLabel="Save"/>
  </>);
}

function ImportModal({onClose,onConfirm}){
  return(<>
    <div style={S.modalTitle}>Import Historical Data</div>
    <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.7,marginBottom:18}}>
      This will load <strong style={{color:"var(--accent)"}}>seed-data.json</strong> from the same folder as this page (i.e. your GitHub Pages site root) and merge it with your current data.<br/><br/>
      <strong style={{color:"var(--text)"}}>What gets imported:</strong><br/>
      · 3 cycles (Cut 2025, Grow 25-26, Cut 2026)<br/>
      · ~1,090 dose entries<br/>
      · 23 weigh-ins<br/>
      · 20 blood panels<br/><br/>
      Existing data on the same date will not be overwritten. Any compound names not yet in your list will be added.<br/><br/>
      <span style={{color:"#ff6b35"}}>⚠ Make sure <code>seed-data.json</code> is uploaded to your repo first.</span>
    </div>
    <Buttons onClose={onClose} onSave={onConfirm} saveLabel="Import"/>
  </>);
}

function SettingsModal({ghConfig,stravaConfig,setStravaConfig,onSave,onClear,onClose}){
  const[gh,setGh]=useState(ghConfig);
  const[sv,setSv]=useState(stravaConfig);
  const ghOk=gh.owner&&gh.repo&&gh.token;
  function saveStrava(){
    setStravaConfig(sv);
    localStorage.setItem(STRAVA_CONFIG_KEY,JSON.stringify(sv));
  }
  return(<>
    <div style={S.modalTitle}>⚙ Settings</div>

    <div style={{fontSize:11,color:"var(--accent)",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:8,marginTop:4}}>GitHub Sync</div>
    <div style={{background:"rgba(0,212,255,0.05)",border:"1px solid rgba(0,212,255,0.15)",borderRadius:8,padding:12,marginBottom:12,fontSize:11,lineHeight:1.7,color:"rgba(255,255,255,0.55)"}}>
      Generate a fine-grained Personal Access Token at github.com → Settings → Developer settings → Fine-grained tokens. Repository access: select your TRT repo. Permissions: <strong style={{color:"var(--text)"}}>Contents → Read and write</strong>.
    </div>
    <label style={S.label}>GitHub Username</label><input style={S.input} value={gh.owner} onChange={e=>setGh(p=>({...p,owner:e.target.value}))}/>
    <label style={S.label}>Repository</label><input style={S.input} value={gh.repo} onChange={e=>setGh(p=>({...p,repo:e.target.value}))}/>
    <label style={S.label}>Personal Access Token</label><input style={S.input} type="password" value={gh.token} onChange={e=>setGh(p=>({...p,token:e.target.value}))}/>
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:24}}>
      {ghOk&&<button style={{...S.btnDanger,fontSize:11}} onClick={()=>{onClear();onClose();}}>Disconnect</button>}
      <button style={S.btn()} onClick={()=>{onSave(gh);onClose();}}>Save GitHub</button>
    </div>

    <div style={{fontSize:11,color:"var(--accent2)",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:8,borderTop:"1px solid var(--border)",paddingTop:18}}>Strava (via Cloudflare Worker)</div>
    <div style={{background:"rgba(127,255,107,0.05)",border:"1px solid rgba(127,255,107,0.15)",borderRadius:8,padding:12,marginBottom:12,fontSize:11,lineHeight:1.7,color:"rgba(255,255,255,0.55)"}}>
      Setup once: deploy <code>worker.js</code> to Cloudflare Workers (free), set <code>STRAVA_CLIENT_ID</code> and <code>STRAVA_CLIENT_SECRET</code> as Worker secrets, paste the Worker URL below, then tap Authorise. See README for the full walkthrough.
    </div>
    <label style={S.label}>Worker URL</label><input style={S.input} placeholder="https://protocol-strava.YOURNAME.workers.dev" value={sv.workerUrl} onChange={e=>setSv(p=>({...p,workerUrl:e.target.value}))}/>
    {sv.refreshToken?<div style={{fontSize:11,color:"#7fff6b",marginBottom:10}}>✓ Connected · last sync {sv.lastSync?fmt(sv.lastSync):"never"}</div>:<div style={{fontSize:11,color:"var(--muted)",marginBottom:10}}>○ Not connected</div>}
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:8,flexWrap:"wrap"}}>
      <button style={S.btn()} onClick={saveStrava}>Save URL</button>
      <button style={{...S.btn(),background:"rgba(127,255,107,0.12)",color:"#7fff6b",borderColor:"rgba(127,255,107,0.3)"}} onClick={()=>{if(!sv.workerUrl){alert("Set Worker URL first");return;}saveStrava();stravaAuth(sv.workerUrl);}}>Authorise Strava</button>
      {sv.refreshToken&&<button style={{...S.btnDanger,fontSize:11}} onClick={()=>{const c={...sv,refreshToken:"",lastSync:null};setSv(c);setStravaConfig(c);localStorage.setItem(STRAVA_CONFIG_KEY,JSON.stringify(c));}}>Disconnect Strava</button>}
    </div>

    <div style={{display:"flex",justifyContent:"flex-end",marginTop:18,borderTop:"1px solid var(--border)",paddingTop:14}}>
      <button style={S.btnCancel} onClick={onClose}>Close</button>
    </div>
  </>);
}

function Buttons({onClose,onSave,saveLabel="Save"}){
  return<div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
    <button style={S.btnCancel} onClick={onClose}>Cancel</button>
    <button style={S.btn()} onClick={onSave}>{saveLabel}</button>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
